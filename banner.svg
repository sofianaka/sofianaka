<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Sofia Nakamaru. Projetos com IA generativa.">
<style>
  .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  /* estrelinhas piscando */
  .estrela { transform-box: fill-box; transform-origin: center; animation: piscar 3.2s ease-in-out infinite; }
  @keyframes piscar { 0%,100% { opacity:.15; transform: scale(.6) rotate(0deg); } 50% { opacity:.95; transform: scale(1) rotate(20deg); } }
  /* textos entram subindo */
  .entra { opacity:0; animation: subir .8s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes subir { from { opacity:0; transform: translateY(22px); } to { opacity:1; transform:none; } }
  /* frases que se revezam */
  .frase { opacity:0; animation: revezar 9s infinite; }
  @keyframes revezar { 0% {opacity:0; transform: translateY(8px);} 4% {opacity:1; transform:none;} 30% {opacity:1; transform:none;} 34% {opacity:0; transform: translateY(-8px);} 100% {opacity:0;} }
  /* rede neural: neurônios aparecem, depois o sinal passa */
  .neuronio { transform-box: fill-box; transform-origin: center; opacity:0; animation: surgir .5s cubic-bezier(.3,1.5,.5,1) forwards; }
  @keyframes surgir { from { opacity:0; transform: scale(0); } to { opacity:1; transform: scale(1); } }
  .ligacao { stroke: #F8F5FC; stroke-opacity:.16; stroke-width:1.5; opacity:0; animation: aparecer 1s .3s forwards; }
  @keyframes aparecer { to { opacity:1; } }
  .sinal { opacity:0; animation: acender 6s infinite; }
  @keyframes acender { 0% {opacity:0;} 3% {opacity:1;} 20% {opacity:1;} 27% {opacity:0;} 100% {opacity:0;} }
</style>
